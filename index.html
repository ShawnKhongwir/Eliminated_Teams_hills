<!DOCTYPE html>
<html>
<head>
    <title>Live BGMI Points - Animated & Paginated</title>
    <style>
        body {
            width: 280px; 
            background-color: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        #title-bar {
            background: linear-gradient(90deg, #f39c12, #e67e22);
            color: #000;
            text-align: center;
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
            padding: 6px 0;
            letter-spacing: 1px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border: 2px solid #222;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        #table-wrapper {
            background: rgba(15, 15, 20, 0.95);
            border: 2px solid #222;
            border-top: none;
            position: relative;
            height: 537px; 
            overflow: hidden;
        }

        .header-row {
            display: flex;
            background-color: #111;
            color: #f39c12;
            font-size: 10px;
            text-transform: uppercase;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #team-list {
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
            position: relative;
            height: 100%;
        }

        .team-row {
            box-sizing: border-box; 
            display: flex;
            align-items: center;
            position: absolute; 
            width: 100%;
            height: 32px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .col-rank { width: 10%; text-align: center; color: #888; font-size: 11px; }
        .col-pts { width: 14%; text-align: center; color: #f39c12; font-size: 13px; font-weight: bold; }
        .col-tag { width: 20%; text-align: left; padding-left: 5px; font-weight: bold; letter-spacing: 1px; }
        .col-total { width: 18%; text-align: center; color: #34dbeb; font-size: 14px; font-weight: 900; }
        .col-alive { width: 24%; display: flex; justify-content: center; gap: 2px; }
        .col-fin { width: 14%; text-align: center; font-weight: bold; }

        /* Elimination Effect */
        .eliminated {
            background-color: rgba(231, 76, 60, 0.15) !important; 
            opacity: 0.55; 
            text-decoration: line-through;
            color: #ffb3b3; 
        }

        .eliminated .col-pts, 
        .eliminated .col-rank,
        .eliminated .col-total {
            color: #ff9999; 
        }

        .health-bar {
            width: 5px; 
            height: 14px;
            border-radius: 1px;
            border: 1px solid #000;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>

    <div id="title-bar">Hills Shillong</div>
    <div id="table-wrapper">
        <div class="header-row">
            <div class="col-rank">#</div>
            <div class="col-pts">M-Pts</div>
            <div class="col-tag">Tag</div>
            <div class="col-total">Total</div>
            <div class="col-alive">Alive</div>
            <div class="col-fin">Fin</div>
        </div>
        <div id="team-list">
            </div>
    </div>

    <script>
        const sheetID = '1Mu6kmtRnnps_Us9kL9q54Vq7PZB579vn28xsm5WvVw8'; 
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:csv`;

        let allTeams = [];
        let currentPage = 0;
        const teamsPerPage = 16; 
        let isPaginating = false; 

        function getHealthColor(status) {
            if (!status) return 'rgba(255, 255, 255, 0.15)';
            const s = status.toUpperCase();
            if (s === 'A') return '#2ecc71'; 
            if (s === 'D') return '#f1c40f'; 
            if (s === 'K') return '#e74c3c'; 
            return 'rgba(255, 255, 255, 0.15)';
        }

        function getSafeId(name) {
            return name.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
        }

        function createTeamRow(teamId) {
            const div = document.createElement('div');
            div.className = 'team-row';
            div.id = `team-${teamId}`;
            div.innerHTML = `
                <div class="col-rank"></div>
                <div class="col-pts" title="Current Match Points"></div>
                <div class="col-tag"></div>
                <div class="col-total" title="Overall Total Points"></div>
                <div class="col-alive"></div>
                <div class="col-fin"></div>
            `;
            document.getElementById('team-list').appendChild(div);
            return div;
        }

        function renderPage() {
            if (allTeams.length === 0 || isPaginating) return;

            const startIndex = currentPage * teamsPerPage;
            const displayTeams = allTeams.slice(startIndex, startIndex + teamsPerPage);
            const visibleSafeIds = displayTeams.map(t => getSafeId(t.name));

            document.querySelectorAll('.team-row').forEach(row => {
                const rowId = row.id.replace('team-', '');
                if (!visibleSafeIds.includes(rowId)) {
                    row.style.display = 'none';
                } else {
                    row.style.display = 'flex';
                }
            });

            displayTeams.forEach((team, index) => {
                const safeId = getSafeId(team.name);
                let row = document.getElementById(`team-${safeId}`);
                
                if (!row) {
                    row = createTeamRow(safeId);
                    row.style.display = 'flex';
                }

                // STRICT ELIMINATION CHECK: Only true if ALL 4 cells have a "K" or "k".
                const isEliminated = 
                    (team.p1 && team.p1.toUpperCase() === 'K') && 
                    (team.p2 && team.p2.toUpperCase() === 'K') && 
                    (team.p3 && team.p3.toUpperCase() === 'K') && 
                    (team.p4 && team.p4.toUpperCase() === 'K');

                if (isEliminated) {
                    row.classList.add('eliminated');
                } else {
                    row.classList.remove('eliminated');
                }

                const yOffset = index * 32; 
                row.style.transform = `translateY(${yOffset}px)`;
                const globalRank = startIndex + index + 1;

                row.querySelector('.col-rank').innerText = globalRank;
                row.querySelector('.col-pts').innerText = team.matchPts;
                row.querySelector('.col-tag').innerText = team.name.substring(0, 3).toUpperCase();
                row.querySelector('.col-total').innerText = team.total; 
                row.querySelector('.col-fin').innerText = team.finishes;
                
                row.querySelector('.col-alive').innerHTML = `
                    <div class="health-bar" style="background-color: ${getHealthColor(team.p1)};"></div>
                    <div class="health-bar" style="background-color: ${getHealthColor(team.p2)};"></div>
                    <div class="health-bar" style="background-color: ${getHealthColor(team.p3)};"></div>
                    <div class="health-bar" style="background-color: ${getHealthColor(team.p4)};"></div>
                `;
            });
        }

        function fetchPoints() {
            fetch(csvUrl)
                .then(response => response.text())
                .then(data => {
                    const rows = data.split('\n').filter(row => row.trim().length > 0);
                    let teams = [];

                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i].split(',').map(col => col.replace(/(^"|"$)/g, '').trim());
                        if (cols.length >= 8 && cols[0] !== "") {
                            let team = {
                                name: cols[0],
                                score: parseInt(cols[1]) || 0,
                                finishes: parseInt(cols[2]) || 0,
                                p1: cols[3], p2: cols[4], p3: cols[5], p4: cols[6],
                                wwcd: parseInt(cols[7]) || 0,
                                prevPts: parseInt(cols[8]) || 0 
                            };
                            team.matchPts = team.score + team.finishes;
                            team.total = team.prevPts + team.matchPts;
                            teams.push(team);
                        }
                    }

                    teams.sort((a, b) => {
                        if (b.total !== a.total) return b.total - a.total;             
                        if (b.matchPts !== a.matchPts) return b.matchPts - a.matchPts; 
                        if (b.wwcd !== a.wwcd) return b.wwcd - a.wwcd;                 
                        return b.finishes - a.finishes;                                
                    });

                    allTeams = teams;
                    renderPage(); 
                })
                .catch(err => console.error('Fetch error:', err));
        }

        fetchPoints();
        setInterval(fetchPoints, 2000); 

        setInterval(() => {
            if (allTeams.length > teamsPerPage) {
                isPaginating = true; 
                const listContainer = document.getElementById('team-list');
                
                listContainer.style.opacity = 0;

                setTimeout(() => {
                    currentPage++;
                    if (currentPage * teamsPerPage >= allTeams.length) {
                        currentPage = 0;
                    }
                    
                    isPaginating = false; 
                    renderPage();
                    listContainer.style.opacity = 1; 
                }, 400); 
            }
        }, 7000); 

    </script>
</body>
</html>
