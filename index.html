<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMI Eliminated Banner with Queue</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Montserrat:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: 'Montserrat', sans-serif;
            background-color: transparent; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #status { position: absolute; top: 10px; left: 10px; color: rgba(255,255,255,0.4); font-size: 11px; }

        /* --- BANNER DESIGN & ANIMATIONS --- */
        .banner-wrapper {
            display: none; /* Hidden by default, controlled by JS queue */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            transform: scale(0.9);
        }

        /* --- LOGO SECTION --- */
        .logo-section {
            width: 180px;
            background-color: #1a2c3a;
            position: relative;
            border-right: 4px solid #00b4db;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease-out;
        }

        .position-no {
            position: absolute;
            top: 5px;
            left: 10px;
            color: white;
            font-size: 18px;
            font-family: 'Teko', sans-serif;
            letter-spacing: 1px;
        }

        .team-logo {
            max-width: 120px;
            max-height: 120px;
            object-fit: contain;
        }

        /* --- RIGHT SECTION --- */
        .right-section {
            display: flex;
            flex-direction: column;
            width: 450px;
        }

        .finishes-box {
            background-color: #1a1a1a;
            color: #ffb347;
            padding: 5px 20px;
            font-size: 28px;
            font-family: 'Teko', sans-serif;
            letter-spacing: 2px;
            width: max-content;
            clip-path: polygon(0 0, 85% 0, 100% 100%, 0% 100%);
            padding-right: 40px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.5s ease-out;
        }

        .eliminated-box {
            background: linear-gradient(90deg, #00b4db, #0083b0, #1a1a24);
            color: white;
            font-size: 55px;
            font-weight: 700;
            padding: 5px 20px;
            letter-spacing: 2px;
            line-height: 1.1;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            transition: all 0.4s ease-out;
        }

        .team-name-box {
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
            padding: 8px 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease-out;
        }

        /* --- ANIMATION STATES (Triggered by JS) --- */
        .banner-wrapper.show {
            opacity: 1;
            transform: scale(1);
        }

        .banner-wrapper.step-1 .eliminated-box {
            opacity: 1;
            transform: scaleY(1);
        }

        .banner-wrapper.step-2 .logo-section,
        .banner-wrapper.step-2 .finishes-box,
        .banner-wrapper.step-2 .team-name-box {
            opacity: 1;
            transform: translate(0, 0);
        }
    </style>
</head>
<body>

    <div id="status">Syncing...</div>

    <div class="banner-wrapper" id="banner">
        <div class="logo-section">
            <div class="position-no" id="pos-text">#0</div>
            <img src="hills_logo.png" alt="Team Logo" class="team-logo" id="logo-img" onerror="this.src='hills_logo.png'">
        </div>
        <div class="right-section">
            <div class="finishes-box" id="finishes-text">0 FINISHES</div>
            <div class="eliminated-box">ELIMINATED</div>
            <div class="team-name-box" id="team-text">TEAM NAME</div>
        </div>
    </div>

    <script>
        const sheetID = '1Mu6kmtRnnps_Us9kL9q54Vq7PZB579vn28xsm5WvVw8';
        const pointsGid = '0';
        const infoGid = '1160777220';
        
        const pointsUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv&gid=${pointsGid}`;
        const infoUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv&gid=${infoGid}`;

        let teamDatabase = {}; 
        let aliveTeamsSet = new Set();
        let isFirstLoad = true;

        let eliminationQueue = [];
        let isAlertShowing = false;
        
        // Timing settings
        const alertShowTime = 6000; // Total time banner stays on screen  
        const queueDelay = 1000;     // Wait time between eliminations if multiple happen at once

        function getDriveImage(url) {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
            }
            return url;
        }

        function fetchTeamInfo() {
            fetch(infoUrl).then(res => res.text()).then(data => {
                const rows = data.split('\n');
                rows.forEach((row, index) => {
                    if (index === 0) return;
                    const cols = row.split(',').map(c => c.replace(/"/g, '').trim());
                    if (cols[0]) teamDatabase[cols[0]] = getDriveImage(cols[1]);
                });
            });
        }

        function checkEliminations() {
            fetch(pointsUrl).then(res => res.text()).then(data => {
                document.getElementById('status').innerText = "Last Sync: " + new Date().toLocaleTimeString();
                const rows = data.split('\n').filter(row => row.trim().length > 0);
                let currentlyAlive = [];

                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(',').map(col => col.replace(/(^"|"$)/g, '').trim());
                    
                    if (cols.length >= 7) {
                        const name = cols[0];
                        
                        // *** IMPORTANT: CHANGE THESE NUMBERS ***
                        // Check your Google sheet. If "Position" is in column B, it's cols[1]. 
                        // If "Total Finishes" is in Column H, it's cols[7].
                        const position = cols[1] || "0"; 
                        const finishes = cols[2] || "0"; 

                        // This checks columns D, E, F, G for an 'a' (alive)
                        const players = [cols[3], cols[4], cols[5], cols[6]].map(p => p.toLowerCase());
                        const isAlive = players.some(p => p === 'a');

                        if (isAlive) {
                            currentlyAlive.push(name);
                        } else {
                            if (!isFirstLoad && aliveTeamsSet.has(name)) {
                                // Added finishes and position to the queue data
                                eliminationQueue.push({ name: name, finishes: finishes, position: position });
                            }
                        }
                    }
                }
                aliveTeamsSet = new Set(currentlyAlive);
                isFirstLoad = false;
                
                processQueue();
            });
        }

        function processQueue() {
            if (eliminationQueue.length > 0 && !isAlertShowing) {
                isAlertShowing = true; 
                const teamData = eliminationQueue.shift(); 
                
                showEliminationAlert(teamData, () => {
                    setTimeout(() => {
                        isAlertShowing = false; 
                        processQueue(); 
                    }, queueDelay);
                });
            }
        }

        function showEliminationAlert(teamData, onFinishedCallback) {
            const banner = document.getElementById('banner');

            // 1. Populate data into the banner
            document.getElementById('team-text').innerText = teamData.name;
            document.getElementById('pos-text').innerText = `#${teamData.position}`;
            document.getElementById('finishes-text').innerText = `${teamData.finishes} FINISHES`;
            
            // Uses your updated transparent png as the default fallback
            document.getElementById('logo-img').src = teamDatabase[teamData.name] || 'hills_logo.png';

            // 2. Reset classes & show wrapper
            banner.className = 'banner-wrapper';
            banner.style.display = 'flex';

            // 3. Play Intro Animations Sequence
            setTimeout(() => { banner.classList.add('show'); }, 100);       // Fade in wrapper
            setTimeout(() => { banner.classList.add('step-1'); }, 600);     // Expand "ELIMINATED"
            setTimeout(() => { banner.classList.add('step-2'); }, 1200);    // Slide in the rest

            // 4. Play Outro Animation after alertShowTime
            setTimeout(() => {
                // Removing the classes triggers the CSS transitions in reverse
                banner.classList.remove('step-2', 'step-1', 'show');

                // Wait for the reverse transition to finish before hiding completely
                setTimeout(() => {
                    banner.style.display = 'none';
                    onFinishedCallback(); // Triggers the next queue item
                }, 600); 

            }, alertShowTime); 
        }

        // Initialize
        fetchTeamInfo();
        setInterval(fetchTeamInfo, 60000); // Check info/logos every 60s
        
        checkEliminations();
        setInterval(checkEliminations, 5000); // Check for "k" triggers every 5s
    </script>
</body>
</html>
